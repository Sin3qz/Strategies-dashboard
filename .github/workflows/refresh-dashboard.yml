name: Dashboard-Daten aktualisieren

on:
  schedule:
    # UTC. Werktags stündlich von 05:41 bis 21:41, am Wochenende dreimal. Achtung: GitHub startet geplante Läufe teils
    # Stunden später oder gar nicht. Pünktlich wird es mit einem externen Anstoß (cron-job.org -> workflow_dispatch, siehe README).
    - cron: "41 5-21 * * 1-5"
    - cron: "41 7,13,19 * * 0,6"
  workflow_dispatch:
    inputs:
      force:
        description: "Alle vier Bots jetzt neu rechnen lassen (auch wenn sie heute schon gelaufen sind)"
        type: boolean
        default: false
      ntfy_test:
        description: "Test-Nachricht an dein ntfy-Topic senden"
        type: boolean
        default: false
  # Nach jedem Merge von Code-Änderungen sofort neu rechnen (Daten-Commits unter data/ lösen nichts aus -> keine Schleife)
  push:
    branches: [main]
    paths: ["dashboard-data/**", ".github/workflows/refresh-dashboard.yml", "index.html"]

permissions:
  contents: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # PAT_PUSH (optional, wie bei den Bot-Repos): Push in deinem Namen -> GitHub deaktiviert den Zeitplan nicht nach 60 Tagen.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_PUSH || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        run: |
          PKGS='pandas>=2.2,<4 numpy>=1.26,<3 pandas_market_calendars>=4.4,<6 yahooquery'
          pip install $PKGS || (sleep 30 && pip install $PKGS)

      # Zeitgeber: Bots anstoßen, die heute noch nicht erfolgreich gelaufen sind (GitHub-Crons kommen teils Stunden später)
      - name: Bots anstoßen
        env:
          # Token mit „Actions: Read and write“ für die vier Bot-Repos; ohne eigenes PAT_DISPATCH wird PAT_PUSH genommen
          PAT_DISPATCH: ${{ secrets.PAT_DISPATCH || secrets.PAT_PUSH }}
          KICK_FILE: ${{ runner.temp }}/kick.json
          KICK_FORCE: ${{ inputs.force && 'true' || 'false' }}   # Schalter beim „Run workflow“
          KICK_WAIT: "480"                            # bis zu 8 min warten, bis angestoßene Bots fertig sind (Ergebnis kommt gleich mit)
        run: python3 dashboard-data/kick_bots.py

      - name: Daten neu berechnen
        env:
          KICK_FILE: ${{ runner.temp }}/kick.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}       # Push bei gekipptem Tagessignal und Cash-Wächter (gleiches Topic wie die Bots)
          NTFY_TEST: ${{ inputs.ntfy_test && 'true' || 'false' }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          RETRY_WAIT: "150"                           # Rückfallebene: ausgefallene Quellen nach 150 s ein zweites Mal holen
        run: |
          # Rückfallebene: bricht der ganze Lauf ab (nichts geladen), nach 5 Minuten einmal komplett neu starten
          python3 dashboard-data/refresh.py "$RUNNER_TEMP/work" || {
            echo "::warning::Lauf fehlgeschlagen - Neustart in 5 Minuten"; sleep 300
            python3 dashboard-data/refresh.py "$RUNNER_TEMP/work"; }

      - name: Commit und Push
        if: always()                                    # auch nach Fehlern: health.json zeigt auf der Seite, was los ist
        run: |
          git config --global user.name "Sin3qz"
          git config --global user.email "patrickdietrich2@gmail.com"
          git add data
          git diff --cached --quiet && echo "Keine Aenderung" && exit 0
          git commit -m "Dashboard-Daten aktualisiert"      # ohne [skip ci]: sonst baut GitHub Pages die Seite nicht neu
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push fehlgeschlagen ($i/3) - neuer Versuch in 15 s"; sleep 15
          done
          exit 1
